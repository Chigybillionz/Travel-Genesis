<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Booking Details</title>
    <link rel="stylesheet" href="bookings.css">

</head>

<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" id="back-btn">←</button>
            <h1 class="header-title">Booking Details </h1>
        </div>

        <div class="content">
            <h2 class="section-title">Your Trip</h2>
            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-label">Date</div>
                    <div class="detail-value" id="booking-date">Loading...</div>
                    <button class="edit-btn" id="edit-date">Edit</button>
                </div>

                <div class="detail-item">
                    <div class="detail-label">Location</div>
                    <div class="detail-value" id="booking-location">United Kingdom, London</div>
                    <button class="edit-btn" id="edit-loacation">Edit</button>
                </div>

                <div class="detail-item">
                    <div class="detail-label">Airline</div>
                    <div class="detail-value" id="booking-airline">British Airways</div>
                </div>

                <div class="detail-item">
                    <div class="detail-label">Seat(s)</div>
                    <div class="detail-value" id="booking-seats">Loading...</div>
                    <button class="edit-btn" id="edit-seat">Edit</button>
                </div>
            </div>

            <div class="total-section">
                <span class="total-label">Total amount to pay:</span>
                <span class="total-amount" id="total-price">loading...</span>
            </div>

            <button class="continue-btn" id="continue-btn">Continue to pay</button>

            <div class="bottom-indicator"></div>
        </div>
    </div>

    <script src="bookings.js">

    </script>

</body>

</html>
