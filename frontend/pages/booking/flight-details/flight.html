<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Flight - Travel Genesis</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="flight.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="goBack()" title="Back to Home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
            </button>
            <h1 class="header-title">Choose flight</h1>
        </div>

        <!-- Route Banner Card -->
        <div class="route-card">
            <div class="route-header">
                <div class="location">
                    <div class="location-label">from</div>
                    <div class="location-name" id="origin-city">Lagos</div>
                    <div class="location-country" id="origin-country">Nigeria</div>
                </div>

                <div class="route-center">
                    <div class="on-time-badge" id="route-badge">100% on time</div>
                    <div class="plane-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#007a8c" stroke-width="2">
                            <path
                                d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" />
                        </svg>
                    </div>
                </div>

                <div class="location" style="text-align: right;">
                    <div class="location-label">to</div>
                    <div class="location-name" id="dest-city">London</div>
                    <div class="location-country" id="dest-country">UK</div>
                </div>
            </div>
        </div>

        <!-- Quick Destination Switcher Pills -->
        <div class="dest-switcher-section">
            <div class="dest-switcher-header">
                <span class="dest-switcher-title">Select Destination:</span>
                <span class="dest-switcher-subtitle" id="active-dest-text">Sydney, Australia</span>
            </div>
            <div class="destination-pills-bar" id="dest-pills">
                <!-- Dynamically populated pills -->
            </div>
        </div>

        <!-- Flights List (Dynamically Rendered for the Selected Destination) -->
        <div class="flights-list" id="flights-list">
            <!-- Flight cards rendered dynamically by flight.js -->
        </div>

        <!-- Action Button -->
        <button class="continue-btn" id="continue-btn" onclick="continueFlight()">Continue</button>

        <div class="home-indicator"></div>
    </div>

    <!-- Scripts -->
    <script src="../../../shared/js/api.js"></script>
    <script src="flight.js"></script>
</body>

</html>
