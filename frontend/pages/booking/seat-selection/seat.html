<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Select Seat(s) - Travel Genesis</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="seat.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <button class="back-btn" id="back-btn" title="Back to Date Picker">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="header-content">
                <h1 class="title">Select Seat(s)</h1>
                <p class="subtitle" id="flight-route-info">Lagos (LOS) ➔ London (LHR)</p>
            </div>
            <div style="width: 36px;"></div> <!-- Spacer for symmetry -->
        </header>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box available"></div>
                <span>Available</span>
            </div>
            <div class="legend-item">
                <div class="legend-box selected"></div>
                <span>Selected</span>
            </div>
            <div class="legend-item">
                <div class="legend-box booked"></div>
                <span>Booked</span>
            </div>
        </div>

        <!-- Airplane Cabin -->
        <div class="airplane">
            <div class="cabin-nose">
                <i class="fa-solid fa-plane-up"></i>
                <span>Front of Aircraft</span>
            </div>

            <div class="column-labels">
                <span>A</span>
                <span>B</span>
                <span>C</span>
                <span>D</span>
                <span>E</span>
            </div>

            <div class="seats-grid">
                <!-- Row 1 -->
                <div class="seat-row">
                    <button class="seat available" data-seat="A1">A1</button>
                    <button class="seat available" data-seat="B1">B1</button>
                    <button class="seat selected" data-seat="C1">C1</button>
                    <button class="seat available" data-seat="D1">D1</button>
                    <button class="seat available" data-seat="E1">E1</button>
                </div>

                <!-- Row 2 -->
                <div class="seat-row">
                    <button class="seat available" data-seat="A2">A2</button>
                    <button class="seat selected" data-seat="B2">B2</button>
                    <button class="seat available" data-seat="C2">C2</button>
                    <button class="seat booked" data-seat="D2" disabled>D2</button>
                    <button class="seat booked" data-seat="E2" disabled>E2</button>
                </div>

                <!-- Row 3 -->
                <div class="seat-row">
                    <button class="seat available" data-seat="A3">A3</button>
                    <button class="seat available" data-seat="B3">B3</button>
                    <button class="seat available" data-seat="C3">C3</button>
                    <button class="seat available" data-seat="D3">D3</button>
                    <button class="seat booked" data-seat="E3" disabled>E3</button>
                </div>

                <!-- Row 4 -->
                <div class="seat-row">
                    <button class="seat available" data-seat="A4">A4</button>
                    <button class="seat booked" data-seat="B4" disabled>B4</button>
                    <button class="seat available" data-seat="C4">C4</button>
                    <button class="seat available" data-seat="D4">D4</button>
                    <button class="seat booked" data-seat="E4" disabled>E4</button>
                </div>

                <!-- Row 5 -->
                <div class="seat-row">
                    <button class="seat booked" data-seat="A5" disabled>A5</button>
                    <button class="seat booked" data-seat="B5" disabled>B5</button>
                    <button class="seat booked" data-seat="C5" disabled>C5</button>
                    <button class="seat available" data-seat="D5">D5</button>
                    <button class="seat booked" data-seat="E5" disabled>E5</button>
                </div>

                <!-- Row 6 -->
                <div class="seat-row">
                    <button class="seat available" data-seat="A6">A6</button>
                    <button class="seat available" data-seat="B6">B6</button>
                    <button class="seat booked" data-seat="C6" disabled>C6</button>
                    <button class="seat booked" data-seat="D6" disabled>D6</button>
                    <button class="seat available" data-seat="E6">E6</button>
                </div>

                <!-- Row 7 -->
                <div class="seat-row">
                    <button class="seat booked" data-seat="A7" disabled>A7</button>
                    <button class="seat booked" data-seat="B7" disabled>B7</button>
                    <button class="seat booked" data-seat="C7" disabled>C7</button>
                    <button class="seat booked" data-seat="D7" disabled>D7</button>
                    <button class="seat booked" data-seat="E7" disabled>E7</button>
                </div>

                <!-- Row 8 -->
                <div class="seat-row">
                    <button class="seat available" data-seat="A8">A8</button>
                    <button class="seat booked" data-seat="B8" disabled>B8</button>
                    <button class="seat available" data-seat="C8">C8</button>
                    <button class="seat booked" data-seat="D8" disabled>D8</button>
                    <button class="seat available" data-seat="E8">E8</button>
                </div>

                <!-- Row 9 -->
                <div class="seat-row">
                    <button class="seat available" data-seat="A9">A9</button>
                    <button class="seat available" data-seat="B9">B9</button>
                    <button class="seat booked" data-seat="C9" disabled>C9</button>
                    <button class="seat available" data-seat="D9">D9</button>
                    <button class="seat available" data-seat="E9">E9</button>
                </div>

                <!-- Row 10 -->
                <div class="seat-row">
                    <button class="seat booked" data-seat="A10" disabled>A10</button>
                    <button class="seat available" data-seat="B10">B10</button>
                    <button class="seat available" data-seat="C10">C10</button>
                    <button class="seat available" data-seat="D10">D10</button>
                    <button class="seat booked" data-seat="E10" disabled>E10</button>
                </div>
            </div>

            <!-- Seat Pagination Nav -->
            <div class="seat-navigation">
                <button id="prev-seats-btn" class="nav-btn" style="display: none;">
                    <i class="fa-solid fa-chevron-left"></i> Previous Rows
                </button>
                <div style="flex: 1;"></div>
                <button id="next-seats-btn" class="nav-btn">
                    Next Rows <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- Selection Summary Bar -->
        <div class="selection-summary">
            <div class="summary-item">
                <span class="summary-label">Selected Seats:</span>
                <span class="summary-val" id="selected-seats-display">C1</span>
            </div>
            <div class="summary-item" style="text-align: right;">
                <span class="summary-label">Total Price:</span>
                <span class="summary-val price-highlight" id="total-price-display">₦1,050,000</span>
            </div>
        </div>

        <button class="continue-btn" id="continue-btn">
            <span>Continue to Passenger Details</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <!-- Scripts -->
    <script src="../../../shared/js/api.js"></script>
    <script src="seat.js"></script>
</body>

</html>
