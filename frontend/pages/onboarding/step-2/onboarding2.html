<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
     <title>TravelGenesis - Get Started</title>
     <meta name="description" content="Start your unforgettable travel journey with TravelGenesis. Curated packages and effortless bookings.">
     <link rel="stylesheet" href="../../../shared/css/design-system.css">
     <link rel="stylesheet" href="onboarding2.css">
</head>

<body>
     <div class="onboarding-page">
          <!-- Atmospheric Background Glows -->
          <div class="ambient-glow glow-1"></div>
          <div class="ambient-glow glow-2"></div>
          <div class="ambient-glow glow-3"></div>

          <!-- Main Content -->
          <div class="content-container">
               <!-- Top Navigation / Header Info -->
               <div class="top-meta">
                    <div class="header-badge">Step 2 of 2</div>
                    <div class="tg-indicator-dots">
                         <div class="tg-dot"></div>
                         <div class="tg-dot active"></div>
                    </div>
               </div>

               <!-- Globe Hero Area -->
               <div class="hero-globe-section">
                    <div class="globe-halo"></div>
                    <div class="globe-card">
                         <img src="../../../assets/brand/travel-logo.png" alt="TravelGenesis Globe" class="globe-img">
                    </div>
                    <div class="brand-pill">
                         <span>✈️</span> Travel<span class="highlight">Genesis</span>
                    </div>
               </div>

               <!-- Copywriting -->
               <div class="text-content">
                    <h1 class="main-heading">Let's find your next<br><span class="accent-text">great travel story</span></h1>
                    <p class="sub-text">The start of every unforgettable journey, curated packages, and effortless flight reservations.</p>
               </div>

               <!-- Action Buttons -->
               <div class="actions-area">
                    <button class="tg-btn get-started-button" id="getStartedBtn">
                         Get Started
                         <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                              <line x1="5" y1="12" x2="19" y2="12"></line>
                              <polyline points="12 5 19 12 12 19"></polyline>
                         </svg>
                    </button>

                    <p class="signin-prompt">
                         Already have an account? <a href="../../auth/login/login.html" class="signin-anchor">Sign In</a>
                    </p>
               </div>
          </div>
     </div>

     <script src="onboarding2.js"></script>
</body>

</html>
