<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelGenesis - Your Journey Begins</title>
    <link rel="stylesheet" href="shared/css/design-system.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #06151B 0%, #00363F 50%, #007A8C 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: var(--tg-font-family);
        }

        .gateway-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            animation: tgFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo-symbol-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(0, 166, 184, 0.5);
            animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .pulse-ring:nth-child(2) {
            animation-delay: 0.6s;
        }

        .brand-icon-box {
            width: 76px;
            height: 76px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
        }

        .brand-icon-box svg {
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
            animation: tgFloat 3s ease-in-out infinite;
        }

        .brand-name {
            font-family: var(--tg-font-heading);
            font-size: 32px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .brand-name span {
            color: #5CE1E6;
        }

        .brand-tagline {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 28px;
        }

        .progress-bar-container {
            width: 160px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #5CE1E6 0%, #FFFFFF 100%);
            border-radius: 10px;
            animation: loadProgress 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            50% { width: 65%; }
            100% { width: 100%; }
        }

        @keyframes ping {
            0% {
                transform: scale(0.85);
                opacity: 0.9;
            }
            80%, 100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="gateway-card">
        <div class="logo-symbol-wrapper">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="brand-icon-box">
                <!-- Sleek Plane & Compass SVG -->
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
                </svg>
            </div>
        </div>

        <h1 class="brand-name">Travel<span>Genesis</span></h1>
        <p class="brand-tagline">Your travel begins with us</p>

        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <script>
        // Smooth transition to Splash screen
        setTimeout(() => {
            document.body.style.transition = 'opacity 0.4s ease';
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = 'pages/onboarding/splash/splash.html';
            }, 400);
        }, 1400);
    </script>
</body>
</html>
