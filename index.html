<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelGenesis - Your Journey Begins</title>
    <meta name="description" content="TravelGenesis - Premium travel booking platform. Discover, book, and manage your trips seamlessly.">
    <link rel="stylesheet" href="shared/css/design-system.css">
    <style>
        /* ── Full-viewport gateway override ─────────────────────────────────── */
        html, body {
            background: #020A10 !important;
            background-image: none !important;
            display: block !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
        }

        .gateway-screen {
            width: 100%;
            min-height: 100vh;
            background:
                radial-gradient(ellipse 70% 50% at 50% 45%, rgba(0, 122, 140, 0.07) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 75% 25%, rgba(92, 225, 230, 0.04) 0%, transparent 55%),
                linear-gradient(170deg, #020A10 0%, #041E26 30%, #053B44 58%, #032D35 80%, #020F15 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 40px;
        }

        /* Subtle starfield */
        .gateway-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 20% 30%, rgba(255, 255, 255, 0.12), transparent),
                radial-gradient(1px 1px at 80% 20%, rgba(255, 255, 255, 0.08), transparent),
                radial-gradient(1px 1px at 50% 70%, rgba(255, 255, 255, 0.06), transparent),
                radial-gradient(1px 1px at 70% 60%, rgba(92, 225, 230, 0.08), transparent);
            z-index: 1;
            pointer-events: none;
            animation: tgFadeIn 2s ease-out 0.3s both;
        }

        /* ── Content ─────────────────────────────────────────────────────── */
        .gateway-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 10;
            opacity: 0;
            animation: gatewayReveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }

        .logo-symbol-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
        }

        /* Soft glow behind icon */
        .logo-symbol-wrapper::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(92, 225, 230, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: ringPulse 4s ease-in-out infinite;
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1.5px solid rgba(92, 225, 230, 0.25);
            animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .pulse-ring:nth-child(2) {
            animation-delay: 0.7s;
        }

        .brand-icon-box {
            width: 80px;
            height: 80px;
            border-radius: 26px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 2;
        }

        .brand-icon-box svg {
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            animation: tgFloat 3.5s ease-in-out infinite;
        }

        .brand-name {
            font-family: var(--tg-font-heading);
            font-size: 40px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -1px;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .brand-name span {
            color: #5CE1E6;
            background: linear-gradient(135deg, #5CE1E6 0%, #A8F5FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-tagline {
            font-size: 15px;
            color: rgba(200, 230, 232, 0.55);
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 36px;
        }

        /* Progress bar */
        .progress-bar-container {
            width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(92, 225, 230, 0.6), #5CE1E6, rgba(255, 255, 255, 0.8));
            border-radius: 10px;
            animation: loadProgress 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
            box-shadow: 0 0 12px rgba(92, 225, 230, 0.4);
        }

        /* ── Keyframes ───────────────────────────────────────────────────── */
        @keyframes gatewayReveal {
            from { opacity: 0; transform: scale(0.95) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            50% { width: 65%; }
            100% { width: 100%; }
        }

        @keyframes ping {
            0% { transform: scale(0.85); opacity: 0.8; }
            80%, 100% { transform: scale(1.7); opacity: 0; }
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(0.9); opacity: 0.4; }
            50% { transform: scale(1.15); opacity: 0.7; }
        }

        /* ── Responsive ──────────────────────────────────────────────────── */
        @media (max-width: 768px) {
            .brand-name { font-size: 34px; }
            .brand-tagline { font-size: 13px; }
        }

        @media (max-width: 480px) {
            .gateway-screen { padding: 24px; }
            .brand-name { font-size: 28px; letter-spacing: -0.5px; }
            .brand-tagline { font-size: 12px; letter-spacing: 1px; }
            .logo-symbol-wrapper { width: 90px; height: 90px; }
            .brand-icon-box { width: 68px; height: 68px; border-radius: 22px; }
            .progress-bar-container { width: 150px; }
        }
    </style>
</head>
<body>
    <div class="gateway-screen">
        <div class="gateway-card">
            <div class="logo-symbol-wrapper">
                <div class="pulse-ring"></div>
                <div class="pulse-ring"></div>
                <div class="brand-icon-box">
                    <!-- Plane Icon -->
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
                    </svg>
                </div>
            </div>

            <h1 class="brand-name">Travel<span>Genesis</span></h1>
            <p class="brand-tagline">Your travel begins with us</p>

            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <script>
        // Smooth transition to Splash screen
        setTimeout(() => {
            const screen = document.querySelector('.gateway-screen');
            if (screen) {
                screen.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                screen.style.opacity = '0';
                screen.style.transform = 'scale(1.02)';
            }
            setTimeout(() => {
                window.location.href = 'pages/onboarding/splash/splash.html';
            }, 500);
        }, 1400);
    </script>
</body>
</html>
